<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="t">
  <title id="t">Tandem — two overlapping squares, a shared middle</title>
  <!-- Concept 5: abstract "tandem as a pair": two rounded squares overlap; the bright middle is what they share. -->
  <defs>
    <clipPath id="right">
      <rect x="92" y="84" width="140" height="140" rx="34"/>
    </clipPath>
  </defs>
  <rect x="24" y="32" width="140" height="140" rx="34" fill="#4F46E5"/>
  <rect x="92" y="84" width="140" height="140" rx="34" fill="#0D9488"/>
  <rect x="24" y="32" width="140" height="140" rx="34" fill="#FCD34D" clip-path="url(#right)"/>
</svg>
