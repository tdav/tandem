  <rect x="132" y="104" width="46" height="108" rx="12" fill="#7DD3FC"/>
  <g fill="#0F172A" opacity="0.35">
    <rect x="88" y="120" width="26" height="7" rx="3.5"/>
    <rect x="88" y="138" width="18" height="7" rx="3.5"/>
    <rect x="88" y="156" width="24" height="7" rx="3.5"/>
    <rect x="142" y="120" width="22" height="7" rx="3.5"/>
    <rect x="142" y="138" width="26" height="7" rx="3.5"/>
    <rect x="142" y="156" width="16" height="7" rx="3.5"/>
