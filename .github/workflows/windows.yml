name: windows

on:
  push:
    branches: [main, windows-release]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-publish:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.100'

      - name: Restore
        run: dotnet restore Tandem.slnx

      - name: Test Core
        if: always()
        run: dotnet test tests/Tandem.Core.Tests --no-restore --logger "console;verbosity=normal"
      - name: Test Archives
        if: always()
        run: dotnet test tests/Tandem.Archives.Tests --no-restore --logger "console;verbosity=normal"
      - name: Test Net
        if: always()
        run: dotnet test tests/Tandem.Net.Tests --no-restore --logger "console;verbosity=normal"
      - name: Test Platform.Windows
        if: always() && hashFiles('tests/Tandem.Platform.Windows.Tests/*.csproj') != ''
        run: dotnet test tests/Tandem.Platform.Windows.Tests --no-restore --logger "console;verbosity=normal"
      - name: Test App
        if: always()
        run: dotnet test tests/Tandem.App.Tests --no-restore --logger "console;verbosity=normal"

      - name: Publish win-x64 (Native AOT)
        if: always()
        shell: pwsh
        run: |
          dotnet publish src/Tandem.App -c Release -r win-x64 -p:DebugType=none -p:DebugSymbols=false -o publish/Tandem
          Rename-Item publish/Tandem/Tandem.App.exe Tandem.exe
          Remove-Item publish/Tandem/*.pdb -ErrorAction SilentlyContinue # debug symbols of the native libraries
          Get-ChildItem publish/Tandem | Format-Table Name, Length
          # Native AOT leaves no managed assemblies: the exe must not be a .NET apphost with Tandem.App.dll beside it.
          if (Test-Path publish/Tandem/Tandem.App.dll) { throw "not a Native AOT build" }

      - name: Smoke test the published exe
        if: always()
        shell: pwsh
        run: |
          $exe = Resolve-Path publish/Tandem/Tandem.exe
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 20
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force smoke | Out-Null
          $bmp.Save("smoke/screen.png")
          $log = Join-Path $env:LOCALAPPDATA "Tandem\Logs\tandem.log"
          if (Test-Path $log) { Copy-Item $log smoke/tandem.log; Get-Content $log }
          if ($p.HasExited) { throw "Tandem exited with code $($p.ExitCode)" }
          "Main window: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "start" -Quiet)) { throw "start error logged" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: smoke
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Tandem-win-x64
          path: publish/Tandem
          if-no-files-found: warn
